---
name: Python Release

on:
  release:
    types: [created]

jobs:
  build_sdist:
    name: Build source packages
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo dnf -y install dnf-plugins-core
        sudo dnf -y builddep createrepo_c.spec
        sudo dnf -y install twine pytest
        pip install --upgrade pip
        pip install build scikit-build-core

    - name: Build Python sdist
      run: python3 -m build --sdist

    - name: Install and Test Python source package
      run: |
        pip install dist/*.tar.gz
        pytest --verbose --color=yes tests/python/tests/

    - uses: actions/upload-artifact@v7
      with:
        name: source
        path: dist/*.tar.gz

  build_bdist:
    name: Build binary wheels
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            arch: x86_64
          - os: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    # setup Python for cibuildwheel
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Build wheels for CPython
      uses: pypa/cibuildwheel@v4.3.5

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.arch }}
        path: ./wheelhouse/*.whl


  upload_pypi:
    name: Publish packages to PyPI
    # only publish packages once everything is successful
    needs: [build_bdist, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.14.0
